<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <style>
    body { font-family: sans-serif; padding: 12px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cell { background: #009688; color: white; padding: 20px; text-align: center; border-radius: 6px; }
    .wide { grid-column: span 2; background: #e91e63; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="cell wide">Wide cell</div>
    <div class="cell">2</div>
    <div class="cell">3</div>
    <div class="cell">4</div>
    <div class="cell">5</div>
    <div class="cell wide">Another wide</div>
  </div>
</body>
</html>
