<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 16px; }
    .calc { width: 280px; }
    #screen { width: 100%; box-sizing: border-box; font-size: 28px; text-align: right; padding: 12px; margin-bottom: 8px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    button { font-size: 22px; padding: 14px 0; }
  </style>
</head>
<body>
  <div class="calc">
    <input id="screen" readonly value="0">
    <div class="keys" id="keys"></div>
  </div>
  <script>
    var keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];
    var screen = document.getElementById('screen');
    var text = '';
    function press(k) {
      if (k === 'C') { text = ''; screen.value = '0'; return; }
      if (k === '=') {
        try {
          var parts = text.match(/^(-?[0-9.]+)([+\-*\/])([0-9.]+)$/);
          if (!parts) { screen.value = 'Error'; text = ''; return; }
          var a = parseFloat(parts[1]), b = parseFloat(parts[3]), r;
          if (parts[2] === '+') r = a + b;
          else if (parts[2] === '-') r = a - b;
          else if (parts[2] === '*') r = a * b;
          else r = a / b;
          text = String(r);
          screen.value = text;
        } catch (e) { screen.value = 'Error'; text = ''; }
        return;
      }
      text += k;
      screen.value = text;
    }
    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.textContent = k;
      b.addEventListener('click', function () { press(k); });
      document.getElementById('keys').appendChild(b);
    });
  </script>
</body>
</html>
