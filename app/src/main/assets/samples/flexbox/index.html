<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
    body { font-family: sans-serif; padding: 12px; }
    .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; background: #ddd; padding: 8px; }
    .item { background: #6200dd; color: white; padding: 16px; border-radius: 6px; }
    .wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .wrap .item { flex: 1 1 100px; text-align: center; }
  </style>
</head>
<body>
  <h3>One row, spaced out</h3>
  <div class="row">
    <div class="item">One</div>
    <div class="item">Two</div>
    <div class="item">Three</div>
  </div>
  <h3>Items that wrap</h3>
  <div class="wrap">
    <div class="item">A</div><div class="item">B</div><div class="item">C</div>
    <div class="item">D</div><div class="item">E</div><div class="item">F</div>
  </div>
</body>
</html>
