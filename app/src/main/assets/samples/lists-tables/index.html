<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists and tables</title>
  <style>
    table { border-collapse: collapse; }
    td, th { border: 1px solid #888; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>Shopping list</h2>
  <ul>
    <li>Apples</li>
    <li>Bread</li>
    <li>Milk</li>
  </ul>
  <h2>Steps</h2>
  <ol>
    <li>Write code</li>
    <li>Tap Run</li>
    <li>Enjoy</li>
  </ol>
  <h2>Table</h2>
  <table>
    <tr><th>Name</th><th>Score</th></tr>
    <tr><td>Asif</td><td>10</td></tr>
    <tr><td>Rima</td><td>8</td></tr>
  </table>
</body>
</html>
