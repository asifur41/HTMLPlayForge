<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Responsive cards</h1>
  <p class="hint">Try the width buttons above the preview.</p>
  <div class="cards">
    <div class="card"><h2>Card one</h2><p>Cards share the row on wide screens.</p></div>
    <div class="card"><h2>Card two</h2><p>They stack on narrow screens.</p></div>
    <div class="card"><h2>Card three</h2><p>This uses CSS grid and a media query.</p></div>
  </div>
</body>
</html>
