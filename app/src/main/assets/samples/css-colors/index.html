<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS colors</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    .box { padding: 16px; margin: 8px 0; border-radius: 8px; color: white; }
    .name { background: red; }
    .hex { background: #2196f3; }
    .rgb { background: rgb(76, 175, 80); }
    .hsl { background: hsl(280, 60%, 45%); }
    .alpha { background: rgba(244, 67, 54, 0.5); color: black; }
    .gradient { background: linear-gradient(90deg, #ff9800, #e91e63); }
  </style>
</head>
<body>
  <div class="box name">Color name: red</div>
  <div class="box hex">Hex: #2196f3</div>
  <div class="box rgb">rgb(76, 175, 80)</div>
  <div class="box hsl">hsl(280, 60%, 45%)</div>
  <div class="box alpha">rgba with see-through</div>
  <div class="box gradient">A gradient</div>
</body>
</html>
