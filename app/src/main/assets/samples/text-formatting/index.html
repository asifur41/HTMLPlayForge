<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text formatting</title>
</head>
<body>
  <h1>Big heading</h1>
  <h2>Smaller heading</h2>
  <p>This is a paragraph with <strong>bold</strong>, <em>italic</em> and <u>underlined</u> text.</p>
  <p>Line one<br>Line two after a break.</p>
  <hr>
  <blockquote>A quote looks like this.</blockquote>
  <p>Write code with <code>the code tag</code>.</p>
  <pre>Preformatted text
   keeps its spaces.</pre>
</body>
</html>
