name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch fonts
        run: bash scripts/fetch_fonts.sh

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing or empty:$missing. Add them in your repo (Settings, Secrets and variables, Actions) or with gh secret set NAME."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::KEYSTORE_BASE64 is not valid. Create it again with: base64 -w0 release.jks | gh secret set KEYSTORE_BASE64"
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unit tests and release build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain

      - name: Collect files
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk release-out/HTMLPlayForge.apk
          cd release-out
          sha256sum HTMLPlayForge.apk > HTMLPlayForge.apk.sha256

      - name: Trust report and guards
        run: bash scripts/trust_report.sh release-out/HTMLPlayForge.apk release-out

      - name: Signing certificate
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs release-out/HTMLPlayForge.apk | tee release-out/SIGNING_CERT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: htmlplayforge-release
          path: |
            release-out/HTMLPlayForge.apk
            release-out/HTMLPlayForge.apk.sha256
            release-out/TRUST_REPORT.md
            release-out/SIGNING_CERT.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: htmlplayforge-release
          path: release-out

      - name: Check that the tag matches versionName
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-out/HTMLPlayForge.apk \
            release-out/HTMLPlayForge.apk.sha256 \
            release-out/TRUST_REPORT.md \
            release-out/SIGNING_CERT.txt \
            --verify-tag --title "HTMLPlayForge $GITHUB_REF_NAME" --generate-notes
